{% if request.target == "clash" or request.target == "clashr" %}
# TaoXing V7 SubConverter generated Clash/Mihomo configuration.
# Nodes, proxy groups and rules below are generated by SubConverter.
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - "+.google.com"
      - "+.googleapis.com"
      - "+.gstatic.com"
      - "+.youtube.com"
      - "+.googlevideo.com"
      - "+.facebook.com"
      - "+.twitter.com"

proxies: ~
proxy-groups: ~
rules: ~
{% endif %}