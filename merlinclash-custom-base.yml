# MerlinClash/SubConverter base template.
# Generated from the user-supplied Clash configuration.
# Node definitions and credentials are intentionally excluded.
# DNS, TUN, profile and rule-provider settings are preserved.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: true
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - localhost
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#淘星网
  fallback: []
  nameserver-policy:
    "rule-set:国内应用域名库":
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    +.cn:
    - https://223.5.5.5/dns-query
    +.qq.com:
    - https://223.5.5.5/dns-query
    +.taobao.com:
    - https://223.5.5.5/dns-query
  respect-rules: true
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
tun:
  enable: false
  # Mihomo Meta v1.14.5 accepts system/gvisor; mixed is a newer value.
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
proxies: ~
proxy-groups: ~
rule-providers:
  国内应用域名库:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.list
    path: ./ruleset/geosite-cn.list
    interval: 86400
rules: ~
