proxy_groups:
  custom_proxy_group:
    - name: "🚀主要代理"
      type: select
      rule: ["[]♻️自动选择", "[]🔯故障转移", "[]🇺🇸 美国地区", "[]🇸🇬 新加坡地区", "[]🇹🇼 台湾地区", "[]🇭🇰 香港地区", "[]🇯🇵 日本地区", "[]🇰🇷 韩国地区", "[]🌍 其他地区"]
    - name: "♻️自动选择"
      type: url-test
      rule: ["[]♻️ 美国自动选择", "[]♻️ 新加坡自动选择", "[]♻️ 台湾自动选择", "[]♻️ 香港自动选择", "[]♻️ 日本自动选择", "[]♻️ 韩国自动选择", "[]♻️ 其他地区自动选择"]
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      tolerance: 50
    - name: "🤖AI服务"
      type: select
      rule: ["[]🇺🇸 美国地区", "[]🇸🇬 新加坡地区", "[]🇹🇼 台湾地区", "[]🇯🇵 日本地区", "[]🇰🇷 韩国地区"]
    - name: "🎬国外流媒体"
      type: select
      rule: ["[]🇸🇬 新加坡地区", "[]🇺🇸 美国地区", "[]🇹🇼 台湾地区", "[]🇭🇰 香港地区", "[]🇯🇵 日本地区", "[]🇰🇷 韩国地区"]
    - name: "📱国外社交软件"
      type: select
      rule: ["[]🇺🇸 美国地区", "[]🇸🇬 新加坡地区", "[]🇹🇼 台湾地区", "[]🇭🇰 香港地区", "[]🇯🇵 日本地区", "[]🇰🇷 韩国地区"]
    - name: "🎮国外游戏平台"
      type: select
      rule: ["[]🇭🇰 香港地区", "[]🇹🇼 台湾地区", "[]🇯🇵 日本地区", "[]🇰🇷 韩国地区", "[]🇸🇬 新加坡地区", "[]🇺🇸 美国地区"]
    - name: "🌐Google服务"
      type: select
      rule: ["[]🇺🇸 美国地区", "[]🇸🇬 新加坡地区", "[]🇹🇼 台湾地区", "[]🇭🇰 香港地区", "[]🇯🇵 日本地区", "[]🇰🇷 韩国地区"]
    - name: "🔯故障转移"
      type: fallback
      rule: ["[]♻️ 美国自动选择", "[]♻️ 新加坡自动选择", "[]♻️ 台湾自动选择", "[]♻️ 日本自动选择", "[]♻️ 韩国自动选择", "[]♻️ 香港自动选择", "[]♻️ 其他地区自动选择"]
      url: "https://www.gstatic.com/generate_204"
      interval: 180
    - name: "🇺🇸 "
      type: select
      rule: ["[]♻️ ", "(?i)(🇺🇸|美国|美國|United States|(^|[^A-Za-z])US([^A-Za-z]|$)|USA|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|达拉斯|達拉斯)"]
    - name: "♻️ "
      type: url-test
      rule: ["(?i)(🇺🇸|美国|美國|United States|(^|[^A-Za-z])US([^A-Za-z]|$)|USA|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|达拉斯|達拉斯)"]
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      tolerance: 50
    - name: "🇸🇬 "
      type: select
      rule: ["[]♻️ ", "(?i)(🇸🇬|新加坡|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$))"]
    - name: "♻️ "
      type: url-test
      rule: ["(?i)(🇸🇬|新加坡|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$))"]
      url: "https://www.gstatic.com/generate_204"
