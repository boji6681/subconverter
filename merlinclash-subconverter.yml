# ============================================================
# TaoXing Clash - MerlinClash SubConverter remote configuration
# Keep only ss, ssr, vmess, vless and trojan nodes for MerlinClash.
# ============================================================
version: 1

common:
  api_mode: false
  api_access_token: ""
  default_url: ""
  exclude_remarks: "(?i)(订阅到期|剩余流量|过期|官网|网站|流量|套餐|群|网址|客服|反馈|失联|重置|更新|获取|备用|邮箱|TG|频道|通知|续费|订阅|测试|代理|节点|公告|💰|🌐|🛫|💫|📣|🔒|🧭|🍀|🛩️|🔰|🚀|☁️|👆|📢|♻️|🔄|🔔|📡|🚥|⏳|❌|⚠️|⚡|📥|🔗|⛔|📊|🪧|🔖|🐦|🔍|🗓️|⌛|🚫)"
  include_remarks: ""
  exclude_remarks_match: false
  include_remarks_match: false
  enable_rule_generator: true
  overwrite_original_rules: true
  enable_filter: true
  # Only retain protocols supported by this MerlinClash/Mihomo package.
  # Unknown or malformed nodes are discarded safely.
  filter_script: |
    function filter(node) {
      try {
        const info = JSON.parse(node.ProxyInfo || "{}");
        const type = String(
          info.Type || info.type || info.Protocol || info.protocol || ""
        ).toLowerCase();

        return [
          "ss", "shadowsocks",
          "ssr", "shadowsocksr",
          "vmess", "vless", "trojan"
        ].includes(type);
      } catch (e) {
        return false;
      }
    }
  udp_flag: false
  sort_flag: false
  append_sub_userinfo: true
  clash_proxies_style: flow
  clash_use_new_field_name: true
  clash_rule_base: "https://raw.githubusercontent.com/boji6681/subconverter/main/merlinclash-clash-base.yml"
  surge_rule_base: ""
  surfboard_rule_base: ""
  mellow_rule_base: ""
  quantumultx_rule_base: ""
  base_path: base
  clash_ruleset: ""
  surge_ruleset: ""
  surfboard_ruleset: ""
  mellow_ruleset: ""
  quantumultx_ruleset: ""
  surge_ssr_path: ""
  renaming_script: ""
  emoji: true
  add_emoji: true
  remove_old_emoji: false
  append_proxy_type: false
  filter_deprecated_nodes: true
  append_sub_userinfo: true

node_pref:
  udp_flag: false
  tcp_fast_open_flag: false
  sort_flag: false
  skip_cert_verify_flag: false
  filter_deprecated_nodes: true

