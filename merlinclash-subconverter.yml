# TaoXing V7 SubConverter remote external configuration.
# Use this URL in Merlin Clash V7: SubConverter local conversion -> Remote configuration.
# This is a SubConverter configuration, not a standalone Clash configuration.
version: 1
common:
  api_mode: false
  default_url: []
  enable_insert: false
  insert_url: []
  prepend_insert_url: false
  exclude_remarks: ["(到期|剩余流量|时间|官网|产品|平台)"]
  include_remarks: []
  enable_filter: true
  # Keep only protocols supported by this MerlinClash build.
  # Unknown or malformed nodes are rejected to keep Mihomo startup-safe.
  filter_script: |
    function filter(node) {
      try {
        const info = JSON.parse(node.ProxyInfo || "{}");
        const type = String(
          info.Type || info.type || info.Protocol || info.protocol || ""
        ).toLowerCase();
        return [
          "ss", "shadowsocks",
          "ssr", "shadowsocksr",
          "vmess", "vless", "trojan"
        ].includes(type);
      } catch (e) {
        return false;
      }
    }
  base_path: base
  clash_rule_base: "https://raw.githubusercontent.com/boji6681/subconverter/main/merlinclash-clash-base.yml"
  proxy_config: SYSTEM
  proxy_ruleset: SYSTEM
  proxy_subscription: SYSTEM
  append_proxy_type: false
node_pref:
  udp_flag: true
  tcp_fast_open_flag: true
  skip_cert_verify_flag: true
  tls13_flag: false
  sort_flag: true
  filter_deprecated_nodes: true
  append_sub_userinfo: true
  clash_use_new_field_name: true
  clash_proxies_style: flow
rulesets:
  enabled: true
  overwrite_original_rules: true
  update_ruleset_on_request: false
  rulesets:    - rule: "IP-CIDR,23.237.231.61/32,no-resolve"`n      group: "DIRECT"
