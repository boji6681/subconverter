proxy_groups:
  custom_proxy_group:
    - name: "🚀主要代理"
      type: "select"
      rule:
        - "[]♻️自动选择"
        - "[]🔯故障转移"
        - "🇺🇸 美国地区"
        - "🇸🇬 新加坡地区"
        - "🇹🇼 台湾地区"
        - "🇭🇰 香港地区"
        - "🇯🇵 日本地区"
        - "🇰🇷 韩国地区"
    - name: "♻️自动选择"
      type: "url-test"
      rule:
        - "[]♻️ 美国自动选择"
        - "[]♻️ 新加坡自动选择"
        - "[]♻️ 台湾自动选择"
        - "[]♻️ 香港自动选择"
        - "[]♻️ 日本自动选择"
        - "[]♻️ 韩国自动选择"
      url: "http://www.gstatic.com/generate_204"
      interval: 300
      tolerance: 50
    - name: "🤖 AI服务"
      type: "select"
      rule:
        - "[]🚀主要代理"
        - "[]♻️自动选择"
        - "[]🔯故障转移"
    - name: "📺 国际媒体"
      type: "select"
      rule:
        - "[]🚀主要代理"
        - "[]♻️自动选择"
        - "[]🔯故障转移"
    - name: "📺 国内媒体"
      type: "select"
      rule:
        - "[]DIRECT"
        - "[]🚀主要代理"
    - name: "🌐 社交平台"
      type: "select"
      rule:
        - "[]🚀主要代理"
        - "[]♻️自动选择"
        - "[]🔯故障转移"
    - name: "🎮 游戏平台"
      type: "select"
      rule:
        - "[]🚀主要代理"
        - "[]DIRECT"
    - name: "🔍 Google服务"
      type: "select"
      rule:
        - "[]🚀主要代理"
        - "[]♻️自动选择"
        - "[]🔯故障转移"
    - name: "♻️ Apple服务"
      type: "select"
      rule:
        - "[]DIRECT"
        - "[]🚀主要代理"
    - name: "📢 广告拦截"
      type: "select"
      rule:
        - "[]REJECT"
        - "[]DIRECT"
    - name: "🐟 漏网之鱼"
      type: "select"
      rule:
        - "[]🚀主要代理"
        - "[]DIRECT"
        - "[]♻️自动选择"
    - name: "🔯故障转移"
      type: "fallback"
      rule:
        - "[]♻️ 美国自动选择"
        - "[]♻️ 新加坡自动选择"
        - "[]♻️ 台湾自动选择"
        - "[]♻️ 香港自动选择"
        - "[]♻️ 日本自动选择"
        - "[]♻️ 韩国自动选择"
      url: "http://www.gstatic.com/generate_204"
