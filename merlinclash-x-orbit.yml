# Orbit v3.0.3 / OpenClash（Mihomo） · 正常订阅：独立模板。
# 将完整内容粘贴到后台对应客户端的 YAML 编辑器，预览、校验后再发布。
# 动态占位符由 Orbit 在下发时展开，本文件不能直接导入 OpenClash（Mihomo）。
# 第一个策略组为可见的纯中文“淘星网”，动态下发分组的第一选项指向该根组。
# 自动选择包含启用、未归档下发分组中当前用户有权使用的全部兼容节点，包括冷门。
# 淘星网的第一选项为自动选择；五个业务分组的第一选项均为淘星网。
# 所有策略组每 300 秒主动测速；select 组显示延迟但不会自动切换选项。
# 国内应用默认直连，可手动切换为淘星网代理；国内域名库每天自动更新。
# 淘星TV指定服务器IP直接命中 DIRECT，不受国内应用手动切换影响。
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: true
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - localhost
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#淘星网
  fallback: []
  nameserver-policy:
    "rule-set:国内应用域名库":
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    +.cn:
    - https://223.5.5.5/dns-query
    +.qq.com:
    - https://223.5.5.5/dns-query
    +.taobao.com:
    - https://223.5.5.5/dns-query
  respect-rules: true
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
x-orbit:
  version: 2
  upstream-groups:
    name-format: '{source}'
    type: select
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Ox.png
    member-selector: source
    sort: source-order
    empty: reject
    node-prefix-format: '{source}'
    root-first: true
    source-prefix-formats:
    - source-key: 9ab736b7-6c27-40cf-9cd8-1879114912c1
      format: 高速
    - source-key: b2448e9b-19e7-4267-8a84-6d19596d3374
      format: 低速
    - source-key: e3a79dc0-3f33-45d6-ad41-1487c14cebf7
      format: 备用
proxies: {{PROXIES}}
proxy-groups:
- name: 淘星网
  type: select
  url: http://www.gstatic.com/generate_204
  interval: 300
  lazy: false
  icon: {{ROOT_ICON}}
  proxies:
  - 自动选择
  - {{UPSTREAM_GROUP_NAMES}}
  - 香港
  - 台湾
  - 美国
  - 日本
  - 韩国
  - 新加坡
  - 冷门
  - 故障转移
  - {{ALL_NODE_MEMBERS}}
