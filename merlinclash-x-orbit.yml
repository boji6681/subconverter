mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: true
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - localhost
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#淘星网 TaoXingWang
  fallback: []
  nameserver-policy:
    +.cn:
    - https://223.5.5.5/dns-query
    +.qq.com:
    - https://223.5.5.5/dns-query
    +.taobao.com:
    - https://223.5.5.5/dns-query
  respect-rules: true
  direct-nameserver:
  - https://223.5.5.5/dns-query
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
x-orbit:
  version: 2
  upstream-groups:
    name-format: "{source}"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Ox.png
    member-selector: source
    sort: source-order
    empty: reject
proxies: {{PROXIES}}
proxy-groups:
- name: 淘星网 TaoXingWang
  type: select
  url: http://www.gstatic.com/generate_204
  interval: 300
  lazy: true
  icon: {{ROOT_ICON}}
  proxies:
  - {{UPSTREAM_GROUP_NAMES}}
  - {{ALL_NODE_MEMBERS}}
  - AI服务 AI Services
  - 流媒体 video
  - 社交软件 Social Media
  - 游戏 Game Platform
  - 谷歌服务 Google Services
  - 香港 Hongkong
  - 台湾 Taiwan
  - 美国 America
  - 日本 Japan
  - 韩国 Korea
  - 新加坡 Singapore
  - 冷门 Remote area
  - 故障转移 Failover
- {{UPSTREAM_GROUPS}}
- name: AI服务 AI Services
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
